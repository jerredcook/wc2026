name: Record a live match

# Saves ESPN's feed for a match while it is being played (scripts/record-live.mjs)
# and keeps the recording as a download on the run's page. The recordings are
# what the live-mode tests are built from.
#
# Start it by hand around kickoff (Actions tab → Record a live match → Run
# workflow), or hours ahead with a start time: the run then waits on GitHub
# until that time and records from there, with no computer of yours involved.
#
#   gh workflow run record-live.yml -f start_at=2026-11-14T20:45Z
#
# The wait can be at most 5 h 45 min (one job may run for six hours). The timed
# starts below are a weak backup: GitHub's scheduler ran them five hours late
# on Nov 13. A start that finds no match in progress or about to begin exits.

on:
  schedule:
    # Nations League quarterfinal first legs, November 2026 (times are UTC).
    - cron: "10,40 0,1 13 11 *"      # Curaçao v Panama, kickoff 00:30 on the 13th
    - cron: "40 1 14 11 *"           # Guatemala v Canada, kickoff 02:00 on the 14th
    - cron: "10,40 2 14 11 *"
    - cron: "10,40 21,22 14 11 *"    # Haiti v USA, kickoff 21:30 on the 14th
  workflow_dispatch:
    inputs:
      matches:
        description: "Matches to consider, as league:event, separated by spaces"
        default: "concacaf.nations.league:401929776 concacaf.nations.league:401929711 concacaf.nations.league:401929710"
      start_at:
        description: "Wait until this time (UTC, like 2026-11-14T20:45Z) before recording. Aim for 45 minutes before kickoff. Empty: record now"
        default: ""

permissions:
  contents: read

concurrency:
  group: record-live
  cancel-in-progress: false

jobs:
  # Sits out the time until start_at. Its own job, so the six hours a job may
  # run are not shared between the waiting and the recording.
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait for the start time
        env:
          START_AT: ${{ inputs.start_at }}
        run: |
          if [ -z "$START_AT" ]; then echo "No start time given: recording now."; exit 0; fi
          at=$(date -u -d "$START_AT" +%s) || { echo "::error::Could not read '$START_AT' as a time. Write it like 2026-11-14T20:45Z."; exit 1; }
          secs=$((at - $(date -u +%s)))
          if [ "$secs" -le 0 ]; then echo "$START_AT has passed: recording now."; exit 0; fi
          if [ "$secs" -gt 20700 ]; then echo "::error::$START_AT is more than 5 h 45 min away, longer than one job may wait. Start this closer to the match."; exit 1; fi
          echo "Waiting $((secs / 60)) minutes, until $START_AT."
          sleep "$secs"

  record:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Record the match
        env:
          MATCHES: ${{ inputs.matches || 'concacaf.nations.league:401929776 concacaf.nations.league:401929711 concacaf.nations.league:401929710' }}
        run: node scripts/record-live.mjs $MATCHES --out recording
      - name: Keep the recording
        if: always() && hashFiles('recording/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-recording-${{ github.run_id }}
          path: recording
          retention-days: 90
