name: Weekly FIFA ranking (2026 archive complete)

# Preserve the live 2026 World Cup data. Runs on GitHub's runners (which can
# reach ESPN — the Anthropic cloud sandbox cannot), captures every played match
# into data/2026-snapshot.json, and commits it when it changes. The script
# merges non-destructively (matches only accumulate; summaries never shrink) and
# exits non-zero if the archive stalls, so a silent ESPN outage emails a failure
# instead of passing green. A separate claude.ai routine reads this file and
# emails the summary.

on:
  schedule:
    - cron: "0 13 * * 1"   # weekly (Mondays 13:00 UTC) — the 2026 archive is complete; this now mainly picks up FIFA ranking releases (~monthly, next Oct 7)
  workflow_dispatch: {}     # allow manual runs from the Actions tab / gh CLI

permissions:
  contents: write           # so the job can push the updated snapshot
  actions: write            # to start the deploy after committing (see "Publish the new data")

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"   # current LTS; the scripts use only stable Node APIs (global fetch, fs/promises)

      - name: Capture live snapshot
        run: node scripts/snapshot-live.mjs

      # Runs even if the snapshot stalls (if: always) — rankings come from a
      # different source (FIFA), so one outage shouldn't block the other.
      - name: Fetch FIFA world ranking (men)
        if: always()
        run: node scripts/fetch-rankings.mjs

      - name: Fetch FIFA world ranking (women)
        if: always()
        run: node scripts/fetch-rankings.mjs --women

      - name: Commit changed data
        id: commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/2026-snapshot.json data/rankings.json data/rankings-women.json)" ]; then
            git add data/2026-snapshot.json data/rankings.json data/rankings-women.json
            git commit -m "Update live data — snapshot + FIFA rankings ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main   # avoid losing the capture to a race with a manual push
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Pushed updated data."
          else
            echo "No data changes — nothing to commit."
          fi

      # A push made by a workflow does not start other workflows, so the deploy
      # has to be started explicitly or the new data never reaches the live site.
      - name: Publish the new data
        if: always() && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
