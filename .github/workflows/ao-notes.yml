name: AO chapter notes and songbook

# Rebuilds data/ao/notes.json: the notes for the watch party card and the
# songbook that a chapter's leaders keep in a Google Sheet (see
# scripts/build-ao-notes.mjs), and commits it when it changed. The sheet's id is
# the AO_SHEETS secret ("chapter-slug=sheet-id"); without it the job does nothing.
#
# It runs often because a note is usually written close to a match ("doors at
# 6"). GitHub starts scheduled jobs late, sometimes very late, so "every 20
# minutes" is a hope, not a promise; it can also be started by hand.

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write     # to start the deploy after committing (see "Publish the new notes")

concurrency:
  group: ao-notes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Read the chapter sheets
        env:
          AO_SHEETS: ${{ secrets.AO_SHEETS }}
        run: node scripts/build-ao-notes.mjs

      - name: See whether anything changed
        id: diff
        run: |
          if [ -n "$(git status --porcelain data/ao/notes.json)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "No changes — nothing to commit."; fi

      # The notes are only committed if the whole test suite passes with them: the deploy runs the same suite,
      # and a note that is committed but cannot be deployed would also hold up every later data refresh.
      - name: Check the notes and the app against them
        if: steps.diff.outputs.changed == 'true'
        run: node --test

      - name: Commit changed notes
        id: commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ao/notes.json
          git commit -m "Update AO chapter notes ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made by a workflow does not start other workflows, so the deploy
      # has to be started explicitly or the new notes never reach the live site.
      - name: Publish the new notes
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub sometimes answers this with a server error (on 2026-11-25 a 504 left new data unpublished), so it is tried a few times.
        run: |
          for try in 1 2 3 4 5; do
            gh workflow run deploy-pages.yml --ref main && exit 0
            echo "Could not start the deploy (try $try of 5)."
            if [ "$try" -lt 5 ]; then sleep $((try * 20)); fi
          done
          exit 1
