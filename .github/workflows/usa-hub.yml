name: USA hub data (fixtures, results, player-pool club form)

# Rebuilds data/usa/men.json and data/usa/women.json from ESPN's public feed and
# commits them when they change. The page reads live scores itself; this job
# keeps the slower-moving parts fresh: the schedule, the squads, and what each
# player did in their club's last three matches. The script exits non-zero and
# leaves the previous file in place if a feed can't be read.

on:
  schedule:
    - cron: "20 * * * *"   # hourly; the script keeps the file byte-identical when nothing changed, so idle runs commit nothing
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write     # to start the deploy after committing (see "Publish the new data")

concurrency:
  group: usa-hub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build USA hub data
        id: build
        continue-on-error: true      # one team failing must not block the other's update; the job still fails at the end
        run: node scripts/build-usa.mjs

      # The data is only committed if the whole test suite passes with it.
      - name: Check the data and the app against it
        run: node --test

      # GitHub pauses scheduled workflows after 60 days without repository
      # activity (this is what silently froze the rankings in 2026). In a long
      # quiet spell, touch a heartbeat file so there is always a recent commit.
      - name: Keep scheduled workflows alive
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$days" -ge 45 ]; then date -u +%Y-%m-%dT%H:%MZ > data/usa/heartbeat.txt; echo "No commits for $days days — wrote a heartbeat."; fi

      - name: Commit changed data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/usa)" ]; then
            git add data/usa
            git commit -m "Update USA hub data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Pushed updated data."
          else
            echo "No data changes — nothing to commit."
          fi

      # A push made by a workflow does not start other workflows, so the deploy
      # has to be started explicitly or the new data never reaches the live site.
      - name: Publish the new data
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Fail the run if the build reported a problem
        if: steps.build.outcome == 'failure'
        run: echo "build-usa.mjs reported a failure for at least one team (see the build step)."; exit 1
