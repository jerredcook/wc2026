name: Release

# Pushing a tag like v0.1.0 publishes a GitHub release for it.
#
# A release is a named checkpoint: the live site already updates on every push
# to main (deploy-pages.yml), so this changes nothing users see. It records
# "this exact code was version 0.1.0", with that version's notes from
# CHANGELOG.md, so there is always a known-good point to go back to.
#
# The tag is refused unless it matches the VERSION line in js/core.js and a
# dated entry at the top of CHANGELOG.md (scripts/release-notes.mjs).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run tests
        run: node --test

      - name: Check the tag against the app's version, and collect the notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Cap Day $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
