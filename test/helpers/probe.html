<!DOCTYPE html>
<!-- Layout probe for test/browser.test.cjs: loads a page of the app in a frame of
     a given width, measures it, and writes the findings as JSON into #out.
     ?url=/&w=360[&live=1][&notices=1]  (live=1 swaps the match card into a live state using a recorded match;
     notices=1 shows the "newer version" and "out of date" bars; sections=a,b,c names the
     elements that must not be empty, for pages other than the front page; expand=1 opens every
     collapsed section first; open=1 unfolds every folding section (details) first; duel=1 sets up a score challenge with the dialog open) -->
<meta charset="utf-8">
<body style="margin:0">
<iframe id="f" style="border:0;display:block"></iframe>
<pre id="out">pending</pre>
<script>
const q = new URLSearchParams(location.search), w = +q.get("w") || 390, minTap = +q.get("min") || 32, f = document.getElementById("f");
f.style.width = w + "px"; f.style.height = "3000px";
const desc = e => (e.tagName.toLowerCase() + (e.id ? "#" + e.id : "") + (e.className && typeof e.className === "string" ? "." + e.className.trim().split(/\s+/).join(".") : "")).slice(0, 60) + " «" + (e.textContent || "").trim().slice(0, 30) + "»";
async function measure() {
  const d = f.contentDocument, win = f.contentWindow, r = { width: w };
  if (q.get("live") && !win.eval("!!focus()")) r.noMatch = true;
  else if (q.get("live")) {
    const G = await (await fetch("/test/fixtures/summary-finished-usa-canada.json")).json();
    G.header.competitions[0].status = { displayClock: "67'", type: { state: "in", shortDetail: "67'" } };
    win.__G = G;
    win.eval("clearTimeout(pollT); refreshLive = function () {}; S.live[focus().id] = parseSummary(__G, '660'); S.liveOk = Date.now(); S.open.xi = true; S.open.l5 = true; renderHero();");
  }
  /* open=1: unfold every folding section, so what is inside them is measured too. */
  if (q.get("open")) { for (const x of d.querySelectorAll("details")) x.open = true; await new Promise(res => setTimeout(res, 300)); }
  if (q.get("expand")) {
    /* Open every collapsed section (a "-toggle" button with a "-body" beside it), then give them a moment to fill in. */
    for (const b of d.querySelectorAll('[id$="-toggle"]')) { const body = d.getElementById(b.id.replace(/-toggle$/, "-body")); if (body && body.getBoundingClientRect().height === 0) b.click(); }
    await new Promise(res => setTimeout(res, 2500));
  }
  if (q.get("duel")) {
    /* A locked call, three friends' calls with long names, and (before kickoff) the challenge dialog open with its QR code. */
    win.eval("(function(){ var m = focus(); if (!m) return; S.name = 'Maximilian-Josef'; S.rivals[m.id] = [{n:'Bartholomew-Jean',us:2,them:0},{n:'Zo\u00eb',us:1,them:1},{n:'W\u0142adys\u0142aw \u017b\u00f3\u0142\u0107',us:0,them:3}]; S.calls[m.id] = {us:1,them:0,locked:true}; renderHero(); if ((S.live[m.id] ? S.live[m.id].state : m.state) === 'pre') openDuel(m.id); })()");
    const dq = d.querySelector("#duelQr svg"), box = dq && dq.getBoundingClientRect();
    r.duel = { match: win.eval("!!focus()"), open: !!d.getElementById("duel").open, qr: !!dq, qrSize: box ? Math.round(box.width) + "x" + Math.round(box.height) : "", text: d.getElementById("duelText").textContent, board: ((d.querySelector(".board") || {}).textContent || "").replace(/\s+/g, " ") };
  }
  if (q.get("notices")) {
    win.eval("S.data[S.team].checked = new Date(Date.now() - 31 * 36e5).toISOString(); renderStale(); document.getElementById('update').hidden = false;");
    r.noticeBars = [...d.querySelectorAll(".notice")].map(e => ({ id: e.id, shown: win.getComputedStyle(e).display !== "none", text: e.textContent.trim().replace(/\s+/g, " ") }));
  }
  const visible = e => { const b = e.getBoundingClientRect(), s = win.getComputedStyle(e); return b.width > 0 && b.height > 0 && s.visibility !== "hidden" && s.display !== "none"; };
  const clipped = e => { for (let p = e.parentElement; p; p = p.parentElement) { const s = win.getComputedStyle(p); if (/(auto|scroll|hidden)/.test(s.overflowX)) return true; } return false; };
  r.pageOverflow = d.documentElement.scrollWidth - d.documentElement.clientWidth;
  r.offScreen = [...d.querySelectorAll("body *")].filter(visible).filter(e => { const b = e.getBoundingClientRect(); return (b.right > w + 1 || b.left < -1) && !clipped(e); }).slice(0, 6).map(desc);
  r.hiddenButShown = [...d.querySelectorAll("[hidden]")].filter(e => win.getComputedStyle(e).display !== "none").map(desc);
  r.sections = {};
  for (const id of (q.get("sections") || "nextup,hero,stories,facts,pool,fixtures,results,poll").split(",")) { const e = d.getElementById(id); r.sections[id] = e ? Math.round(e.getBoundingClientRect().height) : -1; }
  r.smallTargets = [...d.querySelectorAll("button, a.btn, a.subopt, [role=button]")].filter(visible).filter(e => { const b = e.getBoundingClientRect(); return b.height < minTap || b.width < minTap; }).slice(0, +q.get("cap") || 40).map(e => desc(e) + " " + Math.round(e.getBoundingClientRect().width) + "x" + Math.round(e.getBoundingClientRect().height));
  r.brokenLocalImages = [...d.images].filter(i => i.src.startsWith(location.origin) && i.complete && i.naturalWidth === 0).map(i => i.getAttribute("src"));
  r.unlabelledImages = [...d.images].filter(i => !i.hasAttribute("alt")).length;
  r.notices = [...d.querySelectorAll(".empty")].filter(e => /couldn't be shown/.test(e.textContent)).length;
  r.unreachableRows = [...d.querySelectorAll("div[onclick], span[onclick], li[onclick]")].filter(e => e.getAttribute("role") !== "button" || e.getAttribute("tabindex") == null).slice(0, 5).map(desc);
  r.state = (d.querySelector(".hero .kicker") || {}).textContent || "";
  return r;
}
f.onload = () => setTimeout(() => measure().then(r => { document.getElementById("out").textContent = JSON.stringify(r); }, e => { document.getElementById("out").textContent = JSON.stringify({ error: String(e && e.stack || e) }); }), 2500);
f.src = q.get("url") || "/";
</script>
